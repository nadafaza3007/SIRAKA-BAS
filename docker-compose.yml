
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siraka_app
    restart: unless-stopped
    working_dir: /var/www/html
    env_file:
      - .env.docker
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siraka_network

  nginx:
    image: nginx:alpine
    container_name: siraka_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - siraka_network

  db:
    image: mysql:8.0
    container_name: siraka_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: sirakabas
      MYSQL_ROOT_PASSWORD: siraka_root_password
      MYSQL_USER: siraka_user
      MYSQL_PASSWORD: siraka_password
    ports:
      - "3307:3306"
    volumes:
      - siraka_db_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - siraka_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: siraka_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ARBITRARY: 0
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - siraka_network

networks:
  siraka_network:
    driver: bridge

volumes:
  siraka_db_data: